<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UP Sales LIFF — Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Preview only: LINE Seed from npm mirror. Production: self-host official files (see 01_DESIGN_SYSTEM.md) */
@font-face{font-family:"LINE Seed Sans TH";src:url("https://cdn.jsdelivr.net/npm/@fontpkg/line-seed-sans-th@1.0.1/LINESeedSansTH_Rg.ttf");font-weight:400}
@font-face{font-family:"LINE Seed Sans TH";src:url("https://cdn.jsdelivr.net/npm/@fontpkg/line-seed-sans-th@1.0.1/LINESeedSansTH_Bd.ttf");font-weight:700}
@font-face{font-family:"LINE Seed Sans TH";src:url("https://cdn.jsdelivr.net/npm/@fontpkg/line-seed-sans-th@1.0.1/LINESeedSansTH_He.ttf");font-weight:900}
:root{
  --bg:#fff;--fg:#0a0a0a;--muted:#f5f5f5;--mfg:#737373;--border:#e5e5e5;
  --success:#16a34a;--success-soft:#dcfce7;--success-ink:#15803d;
  --warning:#d97706;--warning-soft:#fef3c7;--warning-ink:#b45309;
  --danger:#dc2626;--danger-soft:#fee2e2;--danger-ink:#b91c1c;
  --r:12px;--rs:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Inter","LINE Seed Sans TH",system-ui,sans-serif;background:#e9e9e7;color:var(--fg);-webkit-font-smoothing:antialiased;padding:40px 32px 80px}
.num{font-family:"Inter",sans-serif;font-variant-numeric:tabular-nums}
.page-head{max-width:1500px;margin:0 auto 32px}
.page-head h1{font-size:28px;font-weight:700}
.page-head p{color:var(--mfg);margin-top:6px;font-size:15px;line-height:1.6;max-width:70ch}
.board{max-width:1500px;margin:0 auto;display:flex;flex-wrap:wrap;gap:40px 32px;align-items:flex-start}
figure{width:375px}
figcaption{font-size:14px;line-height:1.5;margin-bottom:10px}
figcaption b{font-weight:700}
figcaption span{display:block;color:var(--mfg);font-size:13px}
.phone{width:375px;height:780px;background:var(--bg);border-radius:28px;overflow:hidden;position:relative;border:1px solid #d4d4d4;display:flex;flex-direction:column}
.phone.tall{height:auto;min-height:780px}
.lbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:13px;color:var(--mfg);border-bottom:1px solid var(--border);flex:none}
.lbar b{color:var(--fg);font-weight:700;font-size:14px}
.scroll{flex:1;overflow:hidden;position:relative}
.pad{padding:16px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.muted{color:var(--mfg)}
.small{font-size:14px;line-height:1.5}
.cap{font-size:12px;line-height:1.4}
.title{font-size:22px;font-weight:700;line-height:1.35}
.h{font-size:18px;font-weight:700;line-height:1.4}
.sec{padding:16px;border-bottom:8px solid var(--muted)}
.sec h3{font-size:16px;font-weight:700;margin-bottom:12px}
label.l{display:block;font-size:14px;font-weight:700;margin:14px 0 6px}
label.l:first-of-type{margin-top:0}
.input{height:48px;border:1px solid var(--border);border-radius:var(--rs);padding:0 14px;display:flex;align-items:center;font-size:16px}
.input.ph{color:#a3a3a3}
.input.focus{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.textarea{min-height:96px;align-items:flex-start;padding-top:12px;line-height:1.6}
.btn{height:48px;border-radius:var(--rs);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;border:1px solid var(--border);background:#fff}
.btn.primary{background:var(--fg);color:#fff;border-color:var(--fg)}
.btn.sm{height:40px;font-size:14px;font-weight:700;padding:0 12px}
.btn.ghost{border-color:transparent}
.btn.dis{background:#d4d4d4;border-color:#d4d4d4;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--border);display:inline-flex;align-items:center;font-size:15px;background:#fff;white-space:nowrap}
.chip.on{background:var(--fg);color:#fff;border-color:var(--fg);font-weight:700}
.chip small{font-size:12px;opacity:.75;margin-left:6px}
.badge{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.b-today{background:var(--fg);color:#fff}
.b-over{background:var(--warning-soft);color:var(--warning-ink)}
.b-fut{border:1px solid var(--border);color:#404040;font-weight:400}
.b-won{background:var(--success-soft);color:var(--success-ink)}
.b-lost{background:var(--danger-soft);color:var(--danger-ink)}
.code{font-family:"Inter",sans-serif;font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;letter-spacing:.01em}
.card{border:1px solid var(--border);border-radius:var(--r);padding:14px;background:#fff}
.card + .card{margin-top:12px}
.acts{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px;margin-top:12px}
.acts .btn{height:40px;font-size:14px}
.sticky{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 22px;background:#fff;border-top:1px solid var(--border)}
.icon{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon.s{width:16px;height:16px}
.avatar{width:36px;height:36px;border-radius:50%;background:#d4d4d4;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;font-size:14px}
.avatar.lg{width:72px;height:72px;font-size:26px}
/* home hero */
.hero{padding:20px 16px 16px}
.hero .big{font-family:"Inter","LINE Seed Sans TH";font-weight:900;font-size:64px;line-height:.95;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero .big span{font-size:22px;font-weight:700;letter-spacing:0;margin-left:6px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:18px}
.day{border-radius:10px;padding:8px 0 7px;text-align:center;border:1px solid var(--border)}
.day .d{font-size:12px;color:var(--mfg)}
.day .n{font-family:Inter;font-weight:700;font-size:17px;margin:2px 0}
.day .c{font-family:Inter;font-size:12px;height:16px;color:var(--fg)}
.day.today{background:var(--fg);border-color:var(--fg);color:#fff}
.day.today .d,.day.today .c{color:#fff}
.day.over .c{color:var(--warning-ink);font-weight:700}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--muted);border-radius:var(--rs);padding:4px;gap:4px}
.tab{height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#404040}
.tab.on{background:#fff;font-weight:700;color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.search{height:44px;border-radius:var(--rs);background:var(--muted);display:flex;align-items:center;gap:8px;padding:0 12px;color:#a3a3a3;font-size:15px;margin-top:12px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{aspect-ratio:1;border-radius:var(--rs);border:1.5px dashed #c4c4c4;display:grid;place-items:center;color:var(--mfg)}
.slot.img{border:none;background:linear-gradient(160deg,#b9c2c9,#7d8a93 55%,#5d6a72);position:relative}
.slot.img::after{content:"";position:absolute;left:10%;right:10%;bottom:22%;height:28%;border-top:3px solid rgba(255,255,255,.55);transform:skewY(-8deg)}
.map{height:150px;background:repeating-linear-gradient(0deg,#f2f2f0 0 22px,#ebebe8 22px 23px),repeating-linear-gradient(90deg,transparent 0 30px,#e3e3df 30px 31px);background-blend-mode:multiply;position:relative;border-radius:var(--rs);overflow:hidden}
.map::before{content:"";position:absolute;left:-10%;right:-10%;top:55%;height:10px;background:#fff;transform:rotate(-12deg);border-top:1px solid #ddd;border-bottom:1px solid #ddd}
.pin{position:absolute;left:50%;top:40%;width:22px;height:22px;border-radius:50% 50% 50% 0;background:var(--fg);transform:translate(-50%,-50%) rotate(-45deg)}
.pin::after{content:"";position:absolute;inset:7px;border-radius:50%;background:#fff}
.alert{border-radius:var(--rs);padding:10px 12px;font-size:14px;line-height:1.5;display:flex;gap:8px;margin-top:8px}
.alert.warn{background:var(--warning-soft);color:var(--warning-ink)}
.alert.ok{background:var(--success-soft);color:var(--success-ink)}
.kv{display:grid;grid-template-columns:110px 1fr;row-gap:10px;font-size:15px;line-height:1.5}
.kv dt{color:var(--mfg)}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--border)}
.tl-i{position:relative;padding-bottom:18px}
.tl-i::before{content:"";position:absolute;left:-22px;top:5px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--fg)}
.tl-i.first::before{background:var(--fg)}
.tl-i .meta{font-size:13px;color:var(--mfg)}
.tl-i p{font-size:15px;line-height:1.6;margin-top:4px}
.mini{display:flex;gap:6px;margin-top:8px}
.mini i{width:56px;height:56px;border-radius:8px;background:linear-gradient(160deg,#b9c2c9,#6f7c85)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--border);border-radius:var(--rs);overflow:hidden}
.seg div{height:48px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:14px;border-right:1px solid var(--border)}
.seg div:last-child{border-right:none}
.seg .on-lost{background:var(--danger);color:#fff;font-weight:700}
.sheet-bg{position:absolute;inset:0;background:rgba(10,10,10,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;padding:10px 16px 22px}
.grab{width:40px;height:5px;border-radius:9px;background:#d4d4d4;margin:0 auto 14px}
.flex{border:1px solid var(--border);border-radius:16px;overflow:hidden;background:#fff;width:290px}
.flex .hero-img{height:150px;background:linear-gradient(160deg,#c3ccd2,#7d8a93 60%,#56636b)}
.flex .fb{padding:14px}
.flex .ft{border-top:1px solid var(--border);padding:10px 14px;display:flex;justify-content:space-between;font-size:13px;color:var(--mfg)}
.flex .fbtn{margin:0 14px 14px;height:40px;border-radius:8px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.chat{background:#8cabd9;padding:16px;display:flex;flex-direction:column;gap:14px;flex:1}
.bubble-row{display:flex;gap:8px;align-items:flex-start}
.bubble-row .who{font-size:12px;color:#fff;margin-bottom:4px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-radius:var(--r)}
.statgrid div{padding:14px;border-bottom:1px solid var(--border)}
.statgrid div:nth-child(odd){border-right:1px solid var(--border)}
.statgrid div:nth-last-child(-n+2){border-bottom:none}
.statgrid .v{font-family:Inter;font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:4px}
.obar{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;margin:10px 0 8px}
.obar i{display:block}
.legend{display:flex;gap:14px;font-size:13px;color:#404040;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.progress{height:6px;border-radius:3px;background:var(--muted);overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--fg)}
.missing{font-size:13px;color:var(--warning-ink);text-align:center;margin-bottom:8px}
@media (max-width:820px){body{padding:20px 12px}figure,.phone{width:100%}}
</style>
</head>

<svg width="0" height="0" style="position:absolute">

  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>

<header class="page-head">
  <h1>UP Sales — LIFF ฝั่งเซลล์</h1>
  <p>ทุกหน้าจอในขนาดมือถือ 375px · ฟอนต์ LINE Seed Sans TH + Inter · ขาวดำ คอนทราสต์สูงสำหรับใช้กลางแดด · สถานะใช้สี success / warning / danger พร้อมไอคอนและข้อความเสมอ · ข้อมูลตัวอย่างจากข้อความจริงในกลุ่ม</p>
</header>

<main class="board">

<!-- L4 HOME -->
<figure>
<figcaption><b>L4 · งานของฉัน (หน้าแรก)</b><span>ตอบ "วันนี้ต้องตามงานไหน" ก่อนอย่างอื่น · แถบ 7 วันแตะเพื่อกรองวัน · ปุ่มรายงานงานใหม่ล่างจอ</span></figcaption>

        <div class="day"><div class="d">อ</div><div class="n">21</div><div class="c">1</div></div>
      </div>
    </div>
    <div style="padding:0 16px">
      <div class="tabs"><div class="tab on">ต้องตาม 3</div><div class="tab">เลยกำหนด 2</div><div class="tab">ทั้งหมด</div></div>
      <div class="search"><svg class="icon s"><use href="#search"/></svg>ค้นหาชื่อ เบอร์ รหัสงาน</div>
      <div style="margin-top:12px">
        <div class="card">
          <div class="row between"><span class="code">#690825-02</span><span class="badge b-today">ตามวันนี้</span></div>

<!-- L5 NEW REPORT -->
<figure>
<figcaption><b>L5 · รายงานงานใหม่ (บน)</b><span>เรียงตามที่ทำจริงหน้างาน: ปักตำแหน่ง → ถ่ายรูป → เบอร์ (ตรวจซ้ำทันที)</span></figcaption>
